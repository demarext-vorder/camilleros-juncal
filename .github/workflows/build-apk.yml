name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Generar proyecto Android
        run: |
          npx cap add android
          VERSION_CODE=${{ github.run_number }} VERSION_NAME=1.0.${{ github.run_number }} python3 scripts/prepare-android.py
          npx cap sync android

      - name: Firma estable (para poder actualizar la app encima de la anterior)
        run: |
          mkdir -p ~/.android
          cp resources/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Camilleros-Juncal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Camilleros-Juncal-APK
          path: Camilleros-Juncal.apk

      - name: Publicar en Releases (para bajar el APK desde el celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Camilleros-Juncal.apk \
            --title "Camilleros Juncal 1.0.${{ github.run_number }}" \
            --notes "APK instalable (compilación #${{ github.run_number }})"
